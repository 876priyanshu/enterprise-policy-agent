services:
  api:
    build: .
    container_name: policy_agent_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override localhost settings to use Docker network hostnames
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - db
      - chromadb
    restart: always

  db:
    image: mysql:8.0
    container_name: policy_agent_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    container_name: policy_agent_chroma
    ports:
      # Mapping host 8001 to container 8000 to avoid conflict with FastAPI on 8000
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: policy_agent_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    restart: always

volumes:
  mysql_data:
  chroma_data: